<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akte Meridian</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  /* Layout: gemalte Szene und Dialog links, Ermittlerakte (Papier) rechts; am Handy gestapelt */
  --ink:#0b101b; --panel:#141d2e; --line:#2a3852; --text:#eef1f6; --muted:#97a4ba;
  --amber:#f2b455; --teal:#58c7bd; --red:#e8604f; --paper:#efe3c4; --paper-ink:#2a2418; --paper-line:#c9b98f; --seal:#7a2e1d;
  --display:'Playfair Display',Georgia,serif; --body:'IBM Plex Sans',system-ui,sans-serif; --type:'Special Elite','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5}
body{background:radial-gradient(1200px 600px at 30% -10%,#1a2740 0,var(--ink) 60%) fixed,var(--ink)}
button,select{font:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;justify-content:space-between}
h1{font-family:var(--display);font-weight:900;font-size:26px;margin:0;color:var(--amber);letter-spacing:.5px;line-height:1.1}
h1 small{display:block;font-family:var(--body);font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0;margin-top:2px}
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{color:var(--amber);font-weight:600}
.chip.warn b{color:var(--red)}
.tog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.tog[aria-pressed="true"]{border-color:var(--teal);color:var(--teal)}
.bar{height:6px;background:var(--panel);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--amber) 35%);width:100%;transition:width .8s}
.main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.left{display:flex;flex-direction:column;gap:14px;min-width:0}
.scene{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:10px;background:#000;box-shadow:0 0 0 1px var(--line),0 18px 50px rgba(0,0,0,.55)}
.cam{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
.cam.on{opacity:1}
.mv{position:absolute;inset:0;animation:kb 46s ease-in-out infinite alternate;transform-origin:50% 60%}
.mv img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes kb{from{transform:scale(1.05) translate(-1.2%,-.6%)}to{transform:scale(1.16) translate(1.6%,1%)}}
.pulse{position:absolute;left:53%;top:44%;width:30%;aspect-ratio:1;border-radius:50%;background:radial-gradient(rgba(70,130,255,.75),rgba(70,130,255,0) 62%);mix-blend-mode:screen;display:none;animation:blink 1.3s steps(1) infinite}
.cam[data-police] .pulse{display:block}
@keyframes blink{0%{opacity:.95}22%{opacity:.15}34%{opacity:.9}52%{opacity:.1}100%{opacity:.1}}
#fx,#map{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#map{background:#0b101b;transition:opacity .35s}
#map[hidden]{display:block;opacity:0}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(5,8,14,.6) 100%),linear-gradient(to top,rgba(5,8,14,.55),transparent 28%)}
.place{position:absolute;left:16px;bottom:14px;font-family:var(--display);font-weight:700;font-size:clamp(18px,2.6vw,28px);text-shadow:0 2px 12px #000;line-height:1.15}
.place small{display:block;font-family:var(--body);font-weight:400;font-size:14px;color:var(--amber);letter-spacing:.4px}
.place.in{animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.titlecard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center,rgba(8,12,20,.35),rgba(8,12,20,.8));transition:opacity .8s;padding:16px}
.titlecard span{font-family:var(--type);letter-spacing:.5em;font-size:clamp(14px,2vw,20px);color:var(--amber);text-indent:.5em}
.titlecard b{font-family:var(--display);font-weight:900;font-size:clamp(40px,8.5vw,96px);line-height:1;text-shadow:0 6px 30px #000}
.titlecard em{font-family:var(--display);font-size:clamp(15px,2.2vw,22px);color:#dfe6f2;margin-top:8px}
.titlecard.gone{opacity:0;pointer-events:none}
.stampbig{position:absolute;right:5%;top:8%;font-family:var(--type);font-size:clamp(22px,4.4vw,48px);padding:.2em .5em;border:.14em solid currentColor;border-radius:8px;transform:rotate(-9deg);background:rgba(8,12,20,.45);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}
.stampbig.win{color:#7be0a2}.stampbig.lose{color:var(--red)}
@keyframes stamp{from{opacity:0;transform:rotate(-9deg) scale(2.6)}to{opacity:1;transform:rotate(-9deg) scale(1)}}
.dialog{display:flex;gap:14px;background:linear-gradient(180deg,#182336,var(--panel));border:1px solid var(--line);border-radius:10px;padding:14px;min-height:136px;align-items:flex-start}
.face{flex:0 0 104px;height:104px;border-radius:10px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:30px;color:#0d1320;background:#8fa3c4;box-shadow:0 0 0 2px var(--line)}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.face.pop{animation:pop .45s ease both}
.face.talk{box-shadow:0 0 0 2px var(--teal),0 0 22px rgba(88,199,189,.35)}

@keyframes talk{from{transform:scale(1.02) translateY(0)}to{transform:scale(1.05) translateY(-1.5%)}}
@keyframes pop{from{opacity:0;transform:translateX(-14px) scale(.94)}to{opacity:1;transform:none}}
.say{min-width:0;flex:1}
.who{font-weight:600;font-size:16px;color:var(--teal);margin:0 0 4px}
.who span{font-weight:400;color:var(--muted);font-size:14px;margin-left:6px}
.txt{margin:0;font-size:17px;white-space:pre-wrap}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.box h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 2px;font-weight:600;color:var(--amber)}
.act{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;background:#0e1524;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;min-height:46px;transition:border-color .15s,transform .15s,background .15s}
.act:hover:not(:disabled){border-color:var(--amber);background:#131c2f;transform:translateX(3px)}
.act small{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.act.done{border-style:dashed;color:var(--muted)}
.act.big{justify-content:center;background:var(--amber);color:#1c1405;border-color:var(--amber);font-weight:600;font-size:17px}
.act.big:hover:not(:disabled){background:#ffc66e;transform:none}
.act:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:15px;margin:0;color:var(--muted)}
.akte{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:14px;font-family:var(--type);min-width:0;box-shadow:0 18px 40px rgba(0,0,0,.5);background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(122,46,29,.07) 27px 28px)}
.akte h2{font-family:var(--type);font-size:15px;margin:0 0 8px;font-weight:400;color:var(--seal);border-bottom:2px solid var(--paper-line);padding-bottom:4px;letter-spacing:.06em;text-transform:uppercase}
.fields{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;font-size:15px}
.fields select{width:100%;background:#fbf4de;color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:4px;padding:6px;min-height:38px}
.sus{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 12px;font-size:15px}
.sus li{transition:opacity .4s}
.sus li.out{text-decoration:line-through;opacity:.4}
.count{font-size:14px;margin:8px 0 0}
.warrant{background:var(--seal);color:#fbf4de;border:0;border-radius:4px;padding:12px;cursor:pointer;font-family:var(--type);font-size:15px;min-height:46px;letter-spacing:.04em}
.warrant:disabled{background:#b9a67c;color:#6b5d3d;cursor:not-allowed}
.stamp{margin:0;font-size:15px;color:var(--seal);border:2px dashed var(--seal);padding:6px 8px;transform:rotate(-1.2deg);animation:stamp2 .4s ease both}
@keyframes stamp2{from{opacity:0;transform:rotate(-1.2deg) scale(1.5)}to{opacity:1;transform:rotate(-1.2deg) scale(1)}}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:15px}
.notes li{border-left:3px solid var(--seal);padding-left:8px}
.notes li.new{animation:rise .5s ease both}
.notes b{display:block;font-size:13px;color:var(--seal);font-weight:400}
.empty{font-size:15px;margin:0;opacity:.7}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}.face{flex-basis:76px;height:76px}.txt{font-size:16px}.dialog{min-height:0}}
@media (prefers-reduced-motion:reduce){.mv,.pulse,.face img,.face,.place,.stampbig,.stamp,.notes li{animation:none!important}.cam,.bar i{transition:none}}

.chint b{font-family:var(--display);font-size:22px;color:var(--amber)}.chint span{font-size:14px}.chint em{font-style:normal;font-weight:600;color:var(--teal,#58c7bd);animation:blink 1s ease-in-out infinite}
.cskip{position:absolute;right:8px;top:8px;z-index:2;background:rgba(13,19,32,.85);color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer;min-height:32px}

@media (max-height:620px) and (orientation:portrait){.scene{max-height:32vh!important}.dialog{max-height:19vh!important}}

.hero.nacht{--ton:url(#f-nacht)}.hero.dunkel{--ton:url(#f-dunkel)}.hero.warm{--ton:url(#f-warm)}.hero.abend{--ton:url(#f-abend)}
