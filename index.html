<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akte Meridian</title>
<meta name="description" content="Akte Meridian: Detektiv-Reisespiel mit handgemalten Schauplätzen. Zeugen befragen, Hinweise sammeln, Haftbefehl ausstellen und die Spur um die Welt verfolgen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: gemalte Szene und Dialog links, Ermittlerakte (Papier) rechts; am Handy gestapelt */
  --ink:#0b101b; --panel:#141d2e; --line:#2a3852; --text:#eef1f6; --muted:#97a4ba;
  --amber:#f2b455; --teal:#58c7bd; --red:#e8604f; --paper:#efe3c4; --paper-ink:#2a2418; --paper-line:#c9b98f; --seal:#7a2e1d;
  --display:'Playfair Display',Georgia,serif; --body:'IBM Plex Sans',system-ui,sans-serif; --type:'Special Elite','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5}
body{background:radial-gradient(1200px 600px at 30% -10%,#1a2740 0,var(--ink) 60%) fixed,var(--ink)}
button,select{font:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;justify-content:space-between}
h1{font-family:var(--display);font-weight:900;font-size:26px;margin:0;color:var(--amber);letter-spacing:.5px;line-height:1.1}
h1 small{display:block;font-family:var(--body);font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0;margin-top:2px}
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{color:var(--amber);font-weight:600}
.chip.warn b{color:var(--red)}
.tog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.tog[aria-pressed="true"]{border-color:var(--teal);color:var(--teal)}
.bar{height:6px;background:var(--panel);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--amber) 35%);width:100%;transition:width .8s}
.main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.left{display:flex;flex-direction:column;gap:14px;min-width:0}
.scene{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:10px;background:#000;box-shadow:0 0 0 1px var(--line),0 18px 50px rgba(0,0,0,.55)}
.cam{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
.cam.on{opacity:1}
.mv{position:absolute;inset:0;animation:kb 46s ease-in-out infinite alternate;transform-origin:50% 60%}
.mv img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes kb{from{transform:scale(1.05) translate(-1.2%,-.6%)}to{transform:scale(1.16) translate(1.6%,1%)}}
.pulse{position:absolute;left:53%;top:44%;width:30%;aspect-ratio:1;border-radius:50%;background:radial-gradient(rgba(70,130,255,.75),rgba(70,130,255,0) 62%);mix-blend-mode:screen;display:none;animation:blink 1.3s steps(1) infinite}
.cam[data-police] .pulse{display:block}
@keyframes blink{0%{opacity:.95}22%{opacity:.15}34%{opacity:.9}52%{opacity:.1}100%{opacity:.1}}
#fx,#map{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#map{background:#0b101b;transition:opacity .35s}
#map[hidden]{display:block;opacity:0}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(5,8,14,.6) 100%),linear-gradient(to top,rgba(5,8,14,.55),transparent 28%)}
.place{position:absolute;left:16px;bottom:14px;font-family:var(--display);font-weight:700;font-size:clamp(18px,2.6vw,28px);text-shadow:0 2px 12px #000;line-height:1.15}
.place small{display:block;font-family:var(--body);font-weight:400;font-size:14px;color:var(--amber);letter-spacing:.4px}
.place.in{animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.titlecard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center,rgba(8,12,20,.35),rgba(8,12,20,.8));transition:opacity .8s;padding:16px}
.titlecard span{font-family:var(--type);letter-spacing:.5em;font-size:clamp(14px,2vw,20px);color:var(--amber);text-indent:.5em}
.titlecard b{font-family:var(--display);font-weight:900;font-size:clamp(40px,8.5vw,96px);line-height:1;text-shadow:0 6px 30px #000}
.titlecard em{font-family:var(--display);font-size:clamp(15px,2.2vw,22px);color:#dfe6f2;margin-top:8px}
.titlecard.gone{opacity:0;pointer-events:none}
.stampbig{position:absolute;right:5%;top:8%;font-family:var(--type);font-size:clamp(22px,4.4vw,48px);padding:.2em .5em;border:.14em solid currentColor;border-radius:8px;transform:rotate(-9deg);background:rgba(8,12,20,.45);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}
.stampbig.win{color:#7be0a2}.stampbig.lose{color:var(--red)}
@keyframes stamp{from{opacity:0;transform:rotate(-9deg) scale(2.6)}to{opacity:1;transform:rotate(-9deg) scale(1)}}
.dialog{display:flex;gap:14px;background:linear-gradient(180deg,#182336,var(--panel));border:1px solid var(--line);border-radius:10px;padding:14px;min-height:136px;align-items:flex-start}
.face{flex:0 0 104px;height:104px;border-radius:10px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:30px;color:#0d1320;background:#8fa3c4;box-shadow:0 0 0 2px var(--line)}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.face.pop{animation:pop .45s ease both}
.face.talk{box-shadow:0 0 0 2px var(--teal),0 0 22px rgba(88,199,189,.35)}
.face.talk img{animation:talk .42s ease-in-out infinite alternate}
@keyframes talk{from{transform:scale(1.02) translateY(0)}to{transform:scale(1.05) translateY(-1.5%)}}
@keyframes pop{from{opacity:0;transform:translateX(-14px) scale(.94)}to{opacity:1;transform:none}}
.say{min-width:0;flex:1}
.who{font-weight:600;font-size:16px;color:var(--teal);margin:0 0 4px}
.who span{font-weight:400;color:var(--muted);font-size:14px;margin-left:6px}
.txt{margin:0;font-size:17px;white-space:pre-wrap}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.box h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 2px;font-weight:600;color:var(--amber)}
.act{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;background:#0e1524;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;min-height:46px;transition:border-color .15s,transform .15s,background .15s}
.act:hover:not(:disabled){border-color:var(--amber);background:#131c2f;transform:translateX(3px)}
.act small{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.act.done{border-style:dashed;color:var(--muted)}
.act.big{justify-content:center;background:var(--amber);color:#1c1405;border-color:var(--amber);font-weight:600;font-size:17px}
.act.big:hover:not(:disabled){background:#ffc66e;transform:none}
.act:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:15px;margin:0;color:var(--muted)}
.akte{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:14px;font-family:var(--type);min-width:0;box-shadow:0 18px 40px rgba(0,0,0,.5);background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(122,46,29,.07) 27px 28px)}
.akte h2{font-family:var(--type);font-size:15px;margin:0 0 8px;font-weight:400;color:var(--seal);border-bottom:2px solid var(--paper-line);padding-bottom:4px;letter-spacing:.06em;text-transform:uppercase}
.fields{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;font-size:15px}
.fields select{width:100%;background:#fbf4de;color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:4px;padding:6px;min-height:38px}
.sus{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 12px;font-size:15px}
.sus li{transition:opacity .4s}
.sus li.out{text-decoration:line-through;opacity:.4}
.count{font-size:14px;margin:8px 0 0}
.warrant{background:var(--seal);color:#fbf4de;border:0;border-radius:4px;padding:12px;cursor:pointer;font-family:var(--type);font-size:15px;min-height:46px;letter-spacing:.04em}
.warrant:disabled{background:#b9a67c;color:#6b5d3d;cursor:not-allowed}
.stamp{margin:0;font-size:15px;color:var(--seal);border:2px dashed var(--seal);padding:6px 8px;transform:rotate(-1.2deg);animation:stamp2 .4s ease both}
@keyframes stamp2{from{opacity:0;transform:rotate(-1.2deg) scale(1.5)}to{opacity:1;transform:rotate(-1.2deg) scale(1)}}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:15px}
.notes li{border-left:3px solid var(--seal);padding-left:8px}
.notes li.new{animation:rise .5s ease both}
.notes b{display:block;font-size:13px;color:var(--seal);font-weight:400}
.empty{font-size:15px;margin:0;opacity:.7}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}.face{flex-basis:76px;height:76px}.txt{font-size:16px}.dialog{min-height:0}}
@media (prefers-reduced-motion:reduce){.mv,.pulse,.face img,.face,.place,.stampbig,.stamp,.notes li{animation:none!important}.cam,.bar i{transition:none}}

.tabs{display:none}
.cam{transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.3,.1,.2,1)}
.cam.zoom{transform:scale(1.32)}
.mv{container-type:size}
.stg{position:absolute;left:50%;top:50%;width:max(100cqw,177.78cqh);aspect-ratio:16/9;transform:translate(-50%,-50%)}
.fig{position:absolute;padding:0;margin:0;border:0;background:none;cursor:pointer;transform:translateX(-50%);-webkit-tap-highlight-color:transparent;animation:figin .7s cubic-bezier(.2,.8,.3,1) both;z-index:2}
.fig.out{animation:figout .45s ease both;pointer-events:none}
.fig img{height:100%;width:auto;display:block;transform-origin:50% 100%;animation:breathe 3.8s ease-in-out infinite;filter:var(--ton,none) drop-shadow(0 0 0 rgba(242,180,85,0));transition:filter .25s;user-select:none;-webkit-user-drag:none}
.fig.full::before{content:"";position:absolute;left:8%;right:8%;bottom:-2.5%;height:7%;border-radius:50%;background:radial-gradient(rgba(0,0,0,.55),rgba(0,0,0,0) 70%)}
.fig.nacht{--ton:url(#f-nacht)}
.fig.dunkel{--ton:url(#f-dunkel)}
.fig.warm{--ton:url(#f-warm)}
.fig.abend{--ton:url(#f-abend)}
.fig:hover img,.fig:focus-visible img{filter:var(--ton,none) drop-shadow(0 0 7px rgba(242,180,85,.95))}
.fig:focus-visible{outline:none}
.fig.talk img{animation:talk .42s ease-in-out infinite alternate}
.fig.chip img{border-radius:50%;aspect-ratio:1;object-fit:cover;box-shadow:0 0 0 3px var(--teal,#58c7bd),0 6px 18px rgba(0,0,0,.6);animation:none}
.fig.chip{animation:figin .7s both,float 3s ease-in-out .7s infinite}
.bub{position:absolute;left:50%;top:-13%;transform:translateX(-50%);min-width:1.5em;height:1.5em;line-height:1.5em;border-radius:50%;background:var(--amber);color:#1c1405;font:700 clamp(12px,1.6cqw,20px)/1.5 var(--body);font-style:normal;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.5);animation:hop 1.1s ease-in-out infinite}
.fig.seen .bub,.fig.talk .bub,.fig:disabled .bub{display:none}
.act.here{border-color:var(--amber)}
.scene{touch-action:manipulation}
.fig{translate:calc(var(--px,0)*var(--par,1)*-.5cqw) 0;transition:translate .5s ease-out}
.fig img{animation-delay:var(--d,0s)}
.fig img.flip{scale:-1 1}
.fig.ext img{animation-duration:4.6s}
.hero{position:absolute;aspect-ratio:328/520;transform:translateX(-50%);pointer-events:none;translate:calc(var(--px,0)*var(--par,1)*-.5cqw) 0;transition:translate .5s ease-out;animation:figin .5s ease both}
.hero img{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 100%;filter:var(--ton,none);user-select:none;-webkit-user-drag:none;animation:breathe 3.8s ease-in-out infinite}
.hero.flip img{scale:-1 1}
.hero.walk img{animation:herobob .28s ease-in-out infinite}
.hero::before{content:"";position:absolute;left:14%;right:14%;bottom:-2.5%;height:7%;border-radius:50%;background:radial-gradient(rgba(0,0,0,.55),rgba(0,0,0,0) 70%)}
.hero.nacht{--ton:url(#f-nacht)}.hero.dunkel{--ton:url(#f-dunkel)}.hero.warm{--ton:url(#f-warm)}.hero.abend{--ton:url(#f-abend)}
@keyframes herobob{50%{transform:translateY(-1.3%)}}
@media (prefers-reduced-motion:reduce){.hero,.hero img{animation:none!important;translate:none}}
.fig:disabled{cursor:default}
.item{position:absolute;width:5.2%;aspect-ratio:1.5;padding:0;border:0;cursor:pointer;z-index:120;transform:translateX(-50%) rotate(-12deg);background:linear-gradient(135deg,#fdf6e3,#e6d5ad);border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.6);animation:glint 1.8s ease-in-out infinite}
.item::after{content:"";position:absolute;inset:18% 14%;border-top:1px solid #8a6f3c;border-bottom:1px solid #8a6f3c}
.item.out,.card.out{display:none}
@keyframes glint{0%,100%{box-shadow:0 2px 6px rgba(0,0,0,.6),0 0 0 0 rgba(242,180,85,.0)}50%{box-shadow:0 2px 6px rgba(0,0,0,.6),0 0 14px 5px rgba(242,180,85,.85)}}
.card{position:absolute;left:50%;top:42%;z-index:6;transform:translate(-50%,-50%) rotate(-4deg);display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;min-width:44%;max-width:86%;padding:12px 18px;border:0;cursor:pointer;color:#2a2113;background:linear-gradient(180deg,#fbf3dc,#ecdcb4);border-radius:6px;box-shadow:0 14px 40px rgba(0,0,0,.65);font-family:var(--type);animation:cardin .5s cubic-bezier(.2,1.4,.4,1) both}
.card small{font-size:11px;letter-spacing:.18em;color:#7a2f25}
.card b{font-size:clamp(18px,3.4vw,40px);letter-spacing:.06em}.card.beleg b{font-size:clamp(15px,2.4vw,28px)}
.card span{font-size:12px;color:#6b5a3a}
.card.ticket{border-left:10px solid #b5483a}
.card.beleg{border-top:6px dashed #8a6f3c}
@keyframes cardin{from{opacity:0;transform:translate(-50%,20%) rotate(8deg) scale(.6)}to{opacity:1;transform:translate(-50%,-50%) rotate(-4deg)}}
.stampbig.tmp{color:var(--amber);right:auto;left:50%;top:38%;margin-left:-4.2em;animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both,fade .5s 1.6s both}
@keyframes fade{to{opacity:0}}
.raid{position:absolute;inset:0;pointer-events:none;z-index:5;mix-blend-mode:screen;animation:raid .5s steps(1) 6}
@keyframes raid{0%{background:radial-gradient(circle at 20% 60%,rgba(60,110,255,.55),transparent 60%)}50%{background:radial-gradient(circle at 80% 60%,rgba(255,60,60,.5),transparent 60%)}}
.hot{position:absolute;width:11%;aspect-ratio:1;padding:0;border:0;background:none;border-radius:50%;cursor:pointer;transform:translate(-50%,50%);z-index:1;-webkit-tap-highlight-color:transparent}
.hot::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:#fff3c4;box-shadow:0 0 8px 3px rgba(255,226,150,.9);animation:twinkle 2.6s ease-in-out infinite}

@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
.item{width:8%;animation:glint 1.3s ease-in-out infinite,hopi 1.3s ease-in-out infinite}

header{display:flex;flex-wrap:nowrap;align-items:center;gap:6px 14px}
header h1{flex:0 0 auto}
.icons{display:flex;gap:6px;flex:0 0 auto}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:#c9d3e6;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:border-color .15s,color .15s}
.ib svg{width:18px;height:18px}.ib:hover,.ib:focus-visible{border-color:var(--amber);color:var(--amber)}
.ib[aria-pressed="true"]{border-color:var(--teal);color:var(--teal)}

.timerow,#hubchip{flex:1 1 auto;min-width:0;display:flex;justify-content:flex-end;align-items:baseline;gap:18px;font-size:14px;color:var(--text);white-space:nowrap}
.timerow b,#hubchip b{color:var(--amber);font-weight:600}

    if(S.warrant)d.append(el('p','stmp','Haftbefehl: '+S.warrant));}
  d.append(el('h3','',act?'Verdächtige in diesem Fall':'Der Zirkel'));const m=act&&LV[LVL].count?matches():ALLSUS,z=el('div','mug');
  (act?SUSPECTS:ALLSUS).forEach(s=>{const a=META.arrested.includes(s.name),c=el('div','mg'+(a?' in':'')+(!a&&!m.includes(s)?' off':''));const im=new Image();im.src='figuren/'+zslug(s.name)+'.webp';im.alt='Zirkel-Mitglied '+s.name;im.loading='lazy';c.append(im,el('b','',s.name),el('small','',a?'in Gewahrsam':(act&&LV[LVL].count&&!m.includes(s)?'passt nicht':'auf freiem Fuß')));z.append(c);});
  d.append(z);sheet('Pinnwand',d,'corkin');}
function cabinet(){const d=el('div','lst');if(!META.cases.length)d.append(el('p','','Der Schrank ist leer. Ihr erster Fall wartet am Telefon.'));
  META.cases.forEach(c=>{const r=el('div','row '+(c.w?'ok':'no'));r.append(el('b','',c.f),el('span','',c.w?'Gelöst · festgenommen: '+c.who+' · '+c.rest+' h vor Fristende':'Offen · entkommen: '+c.who+(c.ha&&c.ha!==c.who?' · Haftbefehl auf '+c.ha:'')),el('small','',c.d+' · '+c.c+' · Stufe '+LV[c.lvl].n+(c.w?' · Prämie '+c.p.toLocaleString('de-DE'):'')));d.append(r);});sheet('Aktenschrank',d);}
function badge(){const n=solved(),nx=RANKS.find(r=>r[0]>n),d=el('div','lst');d.append(el('p','big',rank(n)),el('p','',n+' gelöste Fälle von '+META.cases.length+' · '+META.arrested.length+' von '+ALLSUS.length+' Zirkel-Mitgliedern gefasst'),el('p','','Prämien gesamt: '+META.money.toLocaleString('de-DE')),el('p','',nx?'Nächster Rang: '+nx[1]+' ab '+nx[0]+' gelösten Fällen':'Höchster Rang erreicht.'));

  Object.keys(LV).forEach(k=>{const x=el('button','',LV[k].n);x.type='button';x.setAttribute('aria-pressed',k===(META.lvl||LVL));x.onclick=()=>{META.lvl=k;save();if(MODE!=='case')LVL=k;g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===x));info.textContent=LV[k].d+(MODE==='case'?' Gilt ab dem nächsten Fall.':'');};g.append(x);});

const TRAVEL=[{n:'Frachtmaschine',d:'Mitflug, kostenlos',t:h=>h+8,c:h=>0},{n:'Linienflug',d:'mit Wartezeit',t:h=>h+2,c:h=>100+15*h},{n:'Charterjet',d:'sofort startklar',t:h=>Math.max(1,Math.round(h*.6)),c:h=>600+90*h}];
function book(to,mode){if(S.over||S.busy)return;const from=S.decoy||cityNow().id,h=hours(from,to),cost=mode.c(h);if(cost>S.cash+META.money)return;
  const a=Math.min(S.cash,cost);S.cash-=a;if(cost>a){META.money-=cost-a;save();}closeSheet();travel(to,mode.t(h),to===S.route[S.i+1]&&!isFinal());}
function worldmap(){if(S.over||S.busy)return;const here=S.decoy||cityNow().id,d=el('div','wm'),cv=document.createElement('canvas');cv.width=960;cv.height=540;cv.setAttribute('role','img');cv.setAttribute('aria-label','Weltkarte mit allen Städten');
  const g=cv.getContext('2d'),chips=el('div','wmc'),opt=el('div','wmo'),info=el('p','wmh','Tippen Sie eine Stadt an. Spesen '+S.cash.toLocaleString('de-DE')+' · Prämien '+META.money.toLocaleString('de-DE'));let sel='';
  const ids=Object.keys(CITY).filter(k=>k!==here).sort((a,b)=>hours(here,a)-hours(here,b));
  const draw=()=>{g.fillStyle='#0b101b';g.fillRect(0,0,960,540);g.fillStyle='#2b3b5a';for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(land(x,y)){g.beginPath();g.arc(x*8+4,30+y*8+4,2.3,0,6.3);g.fill();}
    if(sel){const a=proj(...CITY[here].co),b=proj(...CITY[sel].co);g.strokeStyle='rgba(242,180,85,.8)';g.setLineDash([6,7]);g.lineWidth=2.5;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();g.setLineDash([]);}
    Object.keys(CITY).forEach(k=>{const p=proj(...CITY[k].co),me=k===here,on=k===sel;g.fillStyle=me?'#f2b455':on?'#fff':'#58c7bd';g.beginPath();g.arc(p[0],p[1],me||on?9:7,0,6.3);g.fill();if(me||on){g.strokeStyle=g.fillStyle;g.lineWidth=2;g.beginPath();g.arc(p[0],p[1],15,0,6.3);g.stroke();}
      g.fillStyle=me?'#f2b455':'#eef1f6';g.font=(me||on?'700 ':'500 ')+'24px "IBM Plex Sans",sans-serif';const r=p[0]>780||['paris','marrakesch','peking'].includes(k);g.textAlign=r?'right':'left';g.fillText(CITY[k].name,p[0]+(r?-16:16),p[1]+8);});};
  const pick=k=>{sel=k;draw();chips.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));opt.innerHTML='';const h=hours(here,k);info.textContent='Nach '+CITY[k].name+', '+CITY[k].land+' · reine Flugzeit '+h+' h · Spesen '+S.cash.toLocaleString('de-DE')+' · Prämien '+META.money.toLocaleString('de-DE');
    TRAVEL.forEach(mo=>{const c=mo.c(h),b=el('button','');b.type='button';b.append(el('b','',mo.n),el('span','',mo.d),el('em','',mo.t(h)+' h · '+(c?c.toLocaleString('de-DE'):'gratis')));b.disabled=c>S.cash+META.money;b.onclick=()=>book(k,mo);opt.append(b);});};
  ids.forEach(k=>{const b=el('button','',CITY[k].name);b.type='button';b.dataset.k=k;b.setAttribute('aria-pressed','false');b.onclick=()=>pick(k);chips.append(b);});
  cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*960,y=(e.clientY-r.top)/r.height*540;let best='',bd=70;ids.forEach(k=>{const p=proj(...CITY[k].co),q=Math.hypot(p[0]-x,p[1]-y);if(q<bd){bd=q;best=k;}});if(best)pick(best);});
  draw();d.append(cv,info,chips,opt);sheet('Weltkarte',d);}
